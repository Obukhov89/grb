services:
  app:
    build:
      context: ./
      dockerfile: docker/php/dev.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"  # ← поменял порт
    networks:
      - mysql-net
      - app-net
      - push-net
    volumes:
      - upload-data:/var/www/html/upload
      - document-generator-data:/var/www/html/ulab/modules/DocumentGenerator/assets/documents/archive
    env_file:
      - .env
    depends_on:
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mysql:
    image: mysql:5.7.33
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/Moscow
      MYSQL_SQL_MODE: "NO_ENGINE_SUBSTITUTION,NO_AUTO_CREATE_USER,STRICT_TRANS_TABLES"
    ports:
      - "3307:3306"  # ← поменял порт
    networks:
      - mysql-net
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  push-server:
    build:
      context: ./docker/push-server
      dockerfile: Dockerfile
    restart: always
    networks:
      - app-net
      - push-net
    env_file:
      - .env
    depends_on:
      - redis
    command: [ "/bin/sh", "-c", "dos2unix /opt/push-server/push-server-multi.sh && /bin/sh /opt/push-server/push-server-multi.sh start" ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - push-net
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  upload-data:
  mysql-data:
  document-generator-data:
  redis-data:

networks:
  app-net:
  push-net:
  mysql-net: